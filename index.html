<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>EBD · La Roca de Horeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#08152e; --navy-800:#0d1f45; --navy-700:#14295a; --navy-600:#1d3a75;
  --gold:#d9ac3f; --gold-soft:#f1d98f; --ink:#f3eee0; --muted:#a3b3d1;
  --line:rgba(217,172,63,.22); --danger:#ef8577; --ok:#7fd6a0;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--navy-900);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;color:var(--ink)}
h1{font-size:1.7rem;margin-bottom:.4rem}
h2{font-size:1.2rem;margin-bottom:.5rem}
p{max-width:65ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.hidden{display:none!important}

/* Cabecera y navegación */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.6rem 1rem;background:var(--navy-800);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.brand-mark{font-family:var(--serif);font-weight:700;color:var(--navy-900);background:var(--gold);border-radius:6px;padding:.15rem .5rem;font-size:1.05rem}
.brand strong{display:block;font-family:var(--serif);font-size:1rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.1}
.who{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--muted);text-align:right}
.who span{max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:none;color:var(--gold-soft);text-decoration:underline;padding:.4rem .2rem;min-height:44px}
main{max-width:780px;margin:0 auto;padding:1.2rem 1rem calc(6.5rem + env(safe-area-inset-bottom,0px))}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--navy-800);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom button{flex:1;min-height:58px;background:none;border:none;color:var(--muted);font-weight:600;font-size:.95rem;position:relative}
.bottom button.on{color:var(--gold-soft)}
.bottom button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}

/* Botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.6rem 1.2rem;border-radius:10px;border:2px solid var(--gold);background:var(--gold);color:var(--navy-900);font-weight:700}
.btn.sec{background:transparent;color:var(--gold-soft)}
.btn.dng{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.small{min-height:40px;padding:.35rem .8rem;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acciones{display:flex;flex-wrap:wrap;gap:.6rem;margin:.9rem 0}
label{display:block;font-weight:600;margin:.9rem 0 .3rem}
label .opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;min-height:48px;padding:.55rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--navy-900);color:var(--ink);font:inherit;font-size:16px}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--gold)}
input::placeholder{color:#6f83a8}
select option{background:var(--navy-900)}
.check{display:flex;align-items:center;gap:.6rem;margin:.9rem 0}
.check label{margin:0;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr;gap:0 1rem}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}

/* Bloques y listas */
.bloque{margin:1.4rem 0;padding-top:1.1rem;border-top:1px solid var(--line)}
.bloque:first-of-type{border-top:none;padding-top:0}
.aviso{border-left:4px solid var(--gold);background:var(--navy-800);padding:.7rem .9rem;border-radius:0 8px 8px 0;margin:.9rem 0}
.aviso.mal{border-left-color:var(--danger)}
.aviso ul{margin:.3rem 0 0 1.1rem}
.lista{list-style:none}
.fila{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.8rem .2rem;border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;color:var(--ink)}
button.fila:hover{background:var(--navy-800)}
.fila .t{font-weight:700}
.fila .s{color:var(--muted);font-size:.9rem}
.chip{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:.05rem .6rem;border:1px solid var(--gold);color:var(--gold-soft);white-space:nowrap}
.chip.mal{border-color:var(--danger);color:var(--danger)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.vacio{padding:1.6rem 1rem;border:1.5px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);margin:1rem 0}
.vacio strong{display:block;color:var(--ink);font-family:var(--serif);font-size:1.15rem;margin-bottom:.3rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 1rem}
.tabs button{min-height:44px;padding:.4rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:var(--navy-900)}
details{border:1px solid var(--line);border-radius:10px;margin:.6rem 0}
summary{cursor:pointer;padding:.8rem 1rem;font-weight:700;min-height:48px;display:flex;align-items:center}
details .cont{padding:0 1rem 1rem}
.leccion{padding:.7rem 0;border-top:1px solid var(--line)}
.leccion strong{color:var(--gold-soft)}

/* Marcas de lecciones */
.marcas{list-style:none;display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 .4rem}
.marcas li{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:var(--gold-soft)}
.marcas li.on{background:var(--gold);color:var(--navy-900)}
.estado{display:flex;align-items:flex-start;gap:.7rem}
.estado .pt{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--gold);margin-top:.15rem;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--navy-900)}
.estado .pt.ok{background:var(--gold)}

/* Ventanas */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(3,8,20,.75);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center}}
.modal{background:var(--navy-800);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
@media(min-width:620px){.modal{border-radius:16px}}
.modal-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.6rem + env(safe-area-inset-bottom,0px));z-index:60;background:var(--gold);color:var(--navy-900);font-weight:700;padding:.65rem 1.1rem;border-radius:10px;max-width:90vw}
.toast.mal{background:var(--danger)}
.cargando{position:fixed;inset:0;z-index:70;background:rgba(8,21,46,.8);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.2rem}

/* Login */
.entrada{max-width:440px;margin:0 auto;padding:12vh 1.2rem 2rem}
.entrada .brand-mark{font-size:1.4rem;padding:.25rem .7rem}
.entrada h1{margin-top:1rem;font-size:2rem}
.tabla{width:100%;border-collapse:collapse;font-size:.9rem;margin:.6rem 0}
.tabla th,.tabla td{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabla-wrap{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   EBD · La Roca de Horeb — Fase 1
   Pega aquí la configuración del NUEVO proyecto de Firebase de la EBD
   (Configuración del proyecto > Tus apps > Configuración del SDK).
   Este sistema NO comparte proyecto ni datos con tesorería.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD36mj_xRyar5VwQD2GEMkyy5e-SavFNvQ",
  authDomain: "ebd-horeb.firebaseapp.com",
  projectId: "ebd-horeb",
  storageBucket: "ebd-horeb.firebasestorage.app",
  messagingSenderId: "391889648992",
  appId: "1:391889648992:web:9f1e6868b517372ae53205"
};

/* ---------- Estado ---------- */
const CFG_DEF = {pesos:{asistencia:50,biblia:15,revista:15,participacion:10,comportamiento:10},frecuenciaMin:75,puntajeMin:70};
const ROLES = {admin:'Administrador general',superintendente:'Superintendente',profesor:'Profesor'};
const NAV = {
  admin:[['hoy','Hoy'],['alumnos','Alumnos'],['clases','Clases'],['ciclo','Ciclo'],['ajustes','Ajustes']],
  superintendente:[['hoy','Hoy'],['alumnos','Alumnos'],['clases','Clases'],['ciclo','Ciclo']],
  profesor:[['hoy','Hoy'],['alumnos','Mi clase']]
};
const S = {user:null,perfil:null,cfg:CFG_DEF,fajas:[],ciclos:[],ciclo:null,clases:[],usuarios:[],pendientes:[],alumnos:[],
  view:'hoy',param:null,ajTab:'fajas',fq:'',fclase:'',edit:null,lecOpen:false,verInact:false};
let db,auth;
const $ = id => document.getElementById(id);
const ts = () => firebase.firestore.FieldValue.serverTimestamp();
const uid8 = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const normTxt = s => String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const isAdmin = () => S.perfil && S.perfil.rol==='admin';
const isGestor = () => S.perfil && ['admin','superintendente'].includes(S.perfil.rol);
const hoyISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtF = f => f ? f.split('-').reverse().join('/') : '';
const sexoTxt = s => ({varones:'Varones',damas:'Damas',mixta:'Mixta'}[s]||'');

/* ---------- Utilidades de interfaz ---------- */
function toast(msg,mal){
  const t=document.createElement('div'); t.className='toast'+(mal?' mal':''); t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),mal?4200:2200);
}
function cargando(on){
  let c=$('cargando');
  if(on&&!c){c=document.createElement('div');c.id='cargando';c.className='cargando';c.textContent='Cargando…';document.body.appendChild(c);}
  if(!on&&c)c.remove();
}
function closeModal(){const m=$('modal'); if(m)m.remove();}
function openModal(title,body,buttons){
  closeModal();
  const m=document.createElement('div'); m.className='modal-bg'; m.id='modal';
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div>${body}</div><div class="modal-actions"></div></div>`;
  const act=m.querySelector('.modal-actions');
  buttons.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.label;el.onclick=b.fn;act.appendChild(el);});
  document.body.appendChild(m);
  const f=m.querySelector('input:not([type=checkbox]),select,textarea'); if(f)f.focus();
  return m;
}
function confirmBox(msg,ok,danger){
  return new Promise(res=>openModal('Confirmar',`<p>${esc(msg)}</p>`,[
    {label:'Cancelar',cls:'sec',fn:()=>{closeModal();res(false);}},
    {label:ok||'Aceptar',cls:danger?'dng':'',fn:()=>{closeModal();res(true);}}]));
}
function choiceBox(title,msg,choices){
  return new Promise(res=>openModal(title,`<p>${esc(msg)}</p>`,
    [{label:'Cancelar',cls:'sec',fn:()=>{closeModal();res(null);}}].concat(choices.map(c=>({label:c[1],fn:()=>{closeModal();res(c[0]);}})))));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function authErr(e){
  const m={ 'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.',
    'auth/invalid-email':'El correo no es válido.','auth/email-already-in-use':'Ese correo ya tiene una cuenta.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests':'Demasiados intentos. Espera unos minutos e inténtalo otra vez.','auth/network-request-failed':'No hay conexión a internet.','auth/missing-password':'Escribe la contraseña.'};
  return m[e.code]||('No se pudo completar la acción. '+(e.message||''));
}

/* ---------- Inicio ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  if(FIREBASE_CONFIG.apiKey==='REEMPLAZAR'){
    $('app').innerHTML=`<div class="entrada"><h1>Falta la configuración</h1><p class="muted" style="margin-top:.6rem">Abre este archivo, busca <strong>FIREBASE_CONFIG</strong> y pega la configuración del proyecto de Firebase de la EBD.</p></div>`;
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); db=firebase.firestore();
  auth.onAuthStateChanged(async u=>{
    if(!u){S.user=null;S.perfil=null;pantallaLogin();return;}
    S.user=u; cargando(true);
    try{await iniciarSesion();}catch(e){console.error(e);pantallaMensaje('No se pudo abrir el sistema','Revisa tu conexión y las reglas de Firestore de la EBD. Detalle: '+esc(e.message||e));}
    cargando(false);
  });
});

function pantallaMensaje(titulo,texto,extra){
  $('app').innerHTML=`<div class="entrada"><span class="brand-mark">EBD</span><h1>${esc(titulo)}</h1><p class="muted" style="margin-top:.6rem">${texto}</p><div class="acciones">${extra||''}<button class="btn sec" data-act="salir">Salir</button></div></div>`;
}

function pantallaLogin(modo){
  const primer = modo==='primer';
  $('app').innerHTML=`<div class="entrada"><span class="brand-mark">EBD</span><h1>La Roca de Horeb</h1><p class="muted">Escuela Bíblica Dominical</p>
  <div id="frmLogin">
    ${primer?`<label for="l_nom">Tu nombre</label><input id="l_nom" autocomplete="name">`:''}
    <label for="l_mail">Correo</label><input id="l_mail" type="email" autocomplete="username" inputmode="email">
    <label for="l_pass">Contraseña</label><input id="l_pass" type="password" autocomplete="${primer?'new-password':'current-password'}">
    <div class="acciones"><button class="btn" data-act="${primer?'crearprimer':'entrar'}">${primer?'Crear administrador general':'Entrar'}</button></div>
    ${primer?`<p class="muted small">Solo sirve la primera vez, para crear al administrador general. Si el sistema ya tiene administrador, pídele que te dé acceso.</p><button class="link" data-act="modologin" data-m="normal">Volver a entrar</button>`
    :`<button class="link" data-act="olvide">Olvidé mi contraseña</button><br><button class="link" data-act="modologin" data-m="primer">Primer uso del sistema</button>`}
  </div></div>`;
  const p=$('l_pass'); if(p)p.addEventListener('keydown',e=>{if(e.key==='Enter')(primer?acciones.crearprimer:acciones.entrar)();});
}

async function iniciarSesion(){
  const u=S.user;
  const snap=await db.collection('ebd_usuarios').doc(u.uid).get();
  if(snap.exists){
    const p=snap.data();
    if(p.activo===false){pantallaMensaje('Acceso desactivado','Tu acceso a la EBD está desactivado. Habla con el administrador.');return;}
    S.perfil={id:u.uid,...p};
    await cargarBase(); S.view='hoy'; render(); return;
  }
  const init=await db.collection('ebd_config').doc('init').get();
  if(!init.exists){
    pantallaMensaje('Primer uso','Todavía no hay administrador general. Puedes serlo tú.',
      `<input id="b_nom" placeholder="Tu nombre" style="margin-bottom:.6rem"><button class="btn" data-act="bootstrap">Ser administrador general</button>`);
    return;
  }
  await db.collection('ebd_pendientes').doc(u.uid).set({email:u.email||'',fecha:ts()},{merge:true});
  pantallaMensaje('Acceso pendiente','Tu cuenta ('+esc(u.email)+') todavía no tiene un rol en la EBD. Ya avisamos al administrador; cuando te dé acceso, vuelve a entrar.');
}

/* ---------- Carga de datos ---------- */
async function cargarBase(){
  const [cfg,fs,cs]=await Promise.all([
    db.collection('ebd_config').doc('evaluacion').get(),
    db.collection('ebd_fajas').get(),
    db.collection('ebd_ciclos').get()
  ]);
  S.cfg=cfg.exists?{...CFG_DEF,...cfg.data(),pesos:{...CFG_DEF.pesos,...(cfg.data().pesos||{})}}:CFG_DEF;
  S.fajas=fs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.edadMin-b.edadMin);
  S.ciclos=cs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.fechaInicio||'').localeCompare(b.fechaInicio||''));
  S.ciclo=S.ciclos.find(c=>c.estado==='activo')||null;
  await cargarCiclo();
}
async function cargarCiclo(){
  S.clases=[];S.alumnos=[];S.usuarios=[];S.pendientes=[];
  if(isGestor()){
    const us=await db.collection('ebd_usuarios').get();
    S.usuarios=us.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  }
  if(isGestor()){
    const ps=await db.collection('ebd_pendientes').get();
    S.pendientes=ps.docs.map(d=>({id:d.id,...d.data()}));
  }
  if(!S.ciclo)return;
  const cs=await db.collection('ebd_clases').where('cicloId','==',S.ciclo.id).get();
  S.clases=cs.docs.map(d=>({id:d.id,...d.data()})).sort(ordenClases);
  await cargarAlumnos();
}
async function cargarAlumnos(){
  if(isGestor()){
    const r=await db.collection('ebd_alumnos').get();
    S.alumnos=r.docs.map(d=>({id:d.id,...d.data()}));
  }else{
    const ids=misClases().map(c=>c.id); S.alumnos=[];
    for(let i=0;i<ids.length;i+=10){
      const r=await db.collection('ebd_alumnos').where('claseId','in',ids.slice(i,i+10)).get();
      r.docs.forEach(d=>S.alumnos.push({id:d.id,...d.data()}));
    }
  }
  S.alumnos.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
}
function ordenClases(a,b){
  const fa=fajaDe(a.fajaId),fb=fajaDe(b.fajaId);
  return ((fa?fa.edadMin:999)-(fb?fb.edadMin:999))||(a.sexo||'').localeCompare(b.sexo||'')||(a.nombre||'').localeCompare(b.nombre||'','es');
}
const misClases = () => S.clases.filter(c=>(c.equipo||[]).some(e=>e.uid===S.user.uid)||(c.secretario&&c.secretario.uid===S.user.uid));
const fajaDe = id => (S.ciclo&&(S.ciclo.fajasSnap||[]).find(f=>f.id===id))||S.fajas.find(f=>f.id===id)||null;
const claseDe = a => S.clases.find(c=>c.id===a.claseId)||null;

/* ---------- Reglas de fajas y edades ---------- */
function rangoTxt(f){return f.edadMax==null?`${f.edadMin} años en adelante`:`${f.edadMin} a ${f.edadMax} años`;}
function validarFajas(lista){
  const l=[...lista].sort((a,b)=>a.edadMin-b.edadMin), av=[];
  for(let i=0;i<l.length-1;i++){
    const a=l[i],b=l[i+1],aMax=a.edadMax==null?Infinity:a.edadMax;
    if(b.edadMin<=aMax)av.push(`«${a.nombre}» y «${b.nombre}» se superponen: un alumno podría caer en las dos.`);
    else if(b.edadMin>aMax+1)av.push(`Nadie cubre de ${aMax+1} a ${b.edadMin-1} años (entre «${a.nombre}» y «${b.nombre}»).`);
  }
  if(l.length&&l[l.length-1].edadMax!=null)av.push(`Nadie cubre desde ${l[l.length-1].edadMax+1} años en adelante.`);
  return av;
}
function edadEn(fn,ref){
  if(!fn)return null;
  const [y,m,d]=fn.split('-').map(Number); const r=ref?new Date(ref+'T00:00:00'):new Date();
  let e=r.getFullYear()-y; if(r.getMonth()+1<m||(r.getMonth()+1===m&&r.getDate()<d))e--; return e;
}
function sugerirClase(a){
  if(!S.ciclo)return null;
  const e=edadEn(a.fechaNac,S.ciclo.fechaInicio); if(e==null)return null;
  const f=(S.ciclo.fajasSnap||[]).find(f=>e>=f.edadMin&&(f.edadMax==null||e<=f.edadMax)); if(!f)return null;
  const want=a.sexo==='M'?'varones':a.sexo==='F'?'damas':null;
  const cl=S.clases.filter(c=>c.fajaId===f.id);
  const c=(want&&cl.find(c=>c.sexo===want))||cl.find(c=>c.sexo==='mixta');
  return c?c.id:null;
}

function pintarAlumnos(){

  const act=S.alumnos.filter(a=>a.activo!==false).length,sin=g?S.alumnos.filter(a=>a.activo!==false&&!claseDe(a)).length:0;

function aplicarClaseSexo(forzar){
  const sx=$('a_sx'),cl=$('a_cl'); if(!sx||!cl)return;
  const c=S.clases.find(x=>x.id===cl.value),esp=c&&c.sexo==='damas'?'F':c&&c.sexo==='varones'?'M':'';
  if(esp&&(forzar||!sx.value||sx.value===esp)){sx.value=esp;sx.disabled=true;}else sx.disabled=false;
}
async function guardarAlumno(id,otro){
  const d={nombre:$('a_nom').value.trim().replace(/\s+/g,' '),dni:$('a_dni').value.trim(),fechaNac:$('a_fn').value,sexo:$('a_sx').value,
    telefono:$('a_tel').value.trim(),responsable:$('a_resp').value.trim(),claseId:$('a_cl').value,activo:$('a_act').checked};
  if(!d.nombre)return toast('Falta el nombre del alumno.',1);
  if(!d.sexo)return toast('Elige el sexo del alumno.',1);
  const cl=S.clases.find(c=>c.id===d.claseId);
  if(cl&&cl.sexo==='damas'&&d.sexo!=='F')return toast(cl.nombre+' es una clase solo de damas.',1);
  if(cl&&cl.sexo==='varones'&&d.sexo!=='M')return toast(cl.nombre+' es una clase solo de varones.',1);
  if(d.dni&&S.alumnos.some(x=>x.dni===d.dni&&x.id!==id))return toast('Ya hay un alumno con ese DNI.',1);
  if(!d.claseId)d.claseId=sugerirClase(d)||'';
  try{
    if(id){await db.collection('ebd_alumnos').doc(id).update({...d,actualizado:ts()});const i=S.alumnos.findIndex(x=>x.id===id);S.alumnos[i]={...S.alumnos[i],...d};}
    else{const r=await db.collection('ebd_alumnos').add({...d,creado:ts(),actualizado:ts()});S.alumnos.push({id:r.id,...d});}
    S.alumnos.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
    closeModal(); render();
    if(otro){modalAlumno(null,d.claseId);toast('Alumno guardado. Registra el siguiente.');}
    else toast(d.claseId?'Alumno guardado.':'Alumno guardado, sin clase asignada.');
  }catch(e){toast('No se pudo guardar: '+e.message,1);}
}
async function eliminarAlumno(id){
  if(!await confirmBox('¿Eliminar este alumno? Se borra su ficha. Si solo dejó de asistir, es mejor marcarlo como inactivo.','Eliminar',true))return;
  try{await db.collection('ebd_alumnos').doc(id).delete();S.alumnos=S.alumnos.filter(a=>a.id!==id);closeModal();render();toast('Alumno eliminado.');}catch(e){toast(e.message,1);}
}
async function asignarPorEdad(){
  if(!S.clases.length)return toast('Primero crea las clases del ciclo.',1);
  const modo=await choiceBox('Asignar clases por edad','La clase se calcula con la edad que tiene cada alumno al empezar el ciclo, según su sexo y las fajas.',[['sin','Solo alumnos sin clase'],['todos','Todos los activos']]);
  if(!modo)return;
  const cambios=[];let sinDatos=0;
  S.alumnos.filter(a=>a.activo!==false&&(modo==='todos'||!claseDe(a))).forEach(a=>{
    const c=sugerirClase(a); if(!c){sinDatos++;return;} if(c!==a.claseId)cambios.push([a,c]);});
  if(!cambios.length)return toast(`No hay cambios. ${sinDatos?sinDatos+' alumnos sin datos suficientes.':''}`);
  cargando(true);
  try{
    for(let i=0;i<cambios.length;i+=400){const b=db.batch();cambios.slice(i,i+400).forEach(([a,c])=>b.update(db.collection('ebd_alumnos').doc(a.id),{claseId:c,actualizado:ts()}));await b.commit();}
    cambios.forEach(([a,c])=>a.claseId=c); render();
    toast(`Se asignó clase a ${cambios.length} alumnos.${sinDatos?' '+sinDatos+' no se pudieron ubicar.':''}`);
  }catch(e){toast(e.message,1);}
  cargando(false);
}

async function crearCiclo(){
  const nombre=$('n_nom').value.trim(),fecha=$('n_fecha').value,tot=parseInt($('n_tot').value,10);
  if(!nombre)return toast('Falta el nombre del ciclo.',1);
  if(!fecha)return toast('Falta la fecha de la primera sesión.',1);
  if(!(tot>=1&&tot<=30))return toast('La cantidad de lecciones debe estar entre 1 y 30.',1);
  const dadas=parseInt($('n_dadas').value||'0',10);
  if(isNaN(dadas)||dadas<0||dadas>tot)return toast('Las lecciones ya dadas deben estar entre 0 y '+tot+'.',1);
  const activas=S.fajas.filter(f=>f.activa!==false);
  if(validarFajas(activas).length&&!await confirmBox('Las fajas tienen avisos (superposiciones o huecos). ¿Crear el ciclo de todos modos?','Crear ciclo'))return;
  const prev=[...S.ciclos].filter(c=>c.estado==='cerrado').pop(),copia=$('n_copia')&&$('n_copia').checked&&prev;
  cargando(true);
  try{
    const ref=db.collection('ebd_ciclos').doc();
    const snap=activas.map(f=>({id:f.id,nombre:f.nombre,edadMin:f.edadMin,edadMax:f.edadMax==null?null:f.edadMax}));
    const data={nombre,fechaInicio:fecha,totalLecciones:tot,estado:'activo',leccionesDadas:dadas,fajasSnap:snap,evaluacion:JSON.parse(JSON.stringify(S.cfg)),creado:ts()};
    await ref.set(data); let omitidas=0;
    if(copia){
      if(!S.alumnos.length)await cargarAlumnos();
      const old=await db.collection('ebd_clases').where('cicloId','==',prev.id).get(); const mapa={}; const b=db.batch();
      old.docs.forEach(d=>{const c=d.data();if(!snap.some(f=>f.id===c.fajaId)){omitidas++;return;}
        const nr=db.collection('ebd_clases').doc();mapa[d.id]=nr.id;
        b.set(nr,{cicloId:ref.id,nombre:c.nombre,fajaId:c.fajaId,sexo:c.sexo,equipo:c.equipo||[],turno:0,secretario:c.secretario||null,revista:{nombre:'',temaCentral:''},
          lecciones:Array.from({length:tot},(_,i)=>({n:i+1,titulo:'',textoAureo:'',lectura:''})),creado:ts(),actualizado:ts()});});
      await b.commit();
      const mover=S.alumnos.filter(a=>a.claseId&&mapa[a.claseId]);
      for(let i=0;i<mover.length;i+=400){const bb=db.batch();mover.slice(i,i+400).forEach(a=>bb.update(db.collection('ebd_alumnos').doc(a.id),{claseId:mapa[a.claseId]}));await bb.commit();}
      mover.forEach(a=>a.claseId=mapa[a.claseId]);
    }
    S.ciclos.push({id:ref.id,...data}); S.ciclo={id:ref.id,...data};
    const alum=S.alumnos; await cargarCiclo(); if(alum.length&&!S.alumnos.length)S.alumnos=alum;
    render(); toast(copia?`Ciclo creado con las clases copiadas.${omitidas?' '+omitidas+' clases no se copiaron porque su faja ya no está activa.':''}`:'Ciclo creado.');
  }catch(e){toast('No se pudo crear el ciclo: '+e.message,1);}
  cargando(false);
}

  openModal('Corregir lecciones dadas',`<p class="muted">Escribe cuántas lecciones ya se dieron en este ciclo. La próxima será la siguiente.</p><label for="cl_n">Lecciones dadas</label><input id="cl_n" type="number" min="0" max="${c.totalLecciones}" value="${c.leccionesDadas||0}">`,

}
const clasesMarcadas=()=>[...document.querySelectorAll('.u_cl:checked')].map(x=>x.value);
async function sincronizarEquipos(uid,nombre,sel,soloAgregar){
  if(!S.ciclo)return;
  const b=db.batch();let n=0;
  S.clases.forEach(c=>{
    const eq=c.equipo||[],i=eq.findIndex(e=>e.uid===uid||(!e.uid&&normTxt(e.nombre)===normTxt(nombre))),quiere=sel.includes(c.id);
    let nuevo=null,t=c.turno||0;
    if(quiere&&i<0)nuevo=[...eq,{id:uid8(),nombre,uid}];
    else if(quiere&&(eq[i].uid!==uid||eq[i].nombre!==nombre))nuevo=eq.map((e,k)=>k===i?{...e,nombre,uid}:e);
    else if(!quiere&&i>=0&&!soloAgregar){nuevo=eq.filter((_,k)=>k!==i);if(i<t)t--;}
    if(nuevo){t=nuevo.length?Math.max(0,t)%nuevo.length:0;b.update(db.collection('ebd_clases').doc(c.id),{equipo:nuevo,turno:t});c.equipo=nuevo;c.turno=t;n++;}
  });
  if(n)await b.commit();
}

async function guardarUsuario(id){
  const nombre=$('u_nom').value.trim(),rol=$('u_rol').value,sel=clasesMarcadas(); if(!nombre)return toast('Falta el nombre.',1);
  try{
    if(id){
      const d={nombre,rol:isAdmin()&&id===S.user.uid?'admin':rol,activo:id===S.user.uid?true:$('u_act').checked};
      await db.collection('ebd_usuarios').doc(id).update(d);const i=S.usuarios.findIndex(x=>x.id===id);S.usuarios[i]={...S.usuarios[i],...d};
      if(id===S.user.uid){S.perfil={...S.perfil,...d};}
      await sincronizarEquipos(id,nombre,sel,false);
    }else{
      const email=$('u_mail').value.trim(),pass=$('u_pass').value; if(!email)return toast('Falta el correo.',1); if(pass.length<6)return toast('La contraseña debe tener al menos 6 caracteres.',1);
      cargando(true);
      const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
      let cred;
      try{cred=await sec.auth().createUserWithEmailAndPassword(email,pass);}
      catch(e){cargando(false);if(e.code==='auth/email-already-in-use')return toast('Ese correo ya tiene cuenta. Pídele que entre una vez a este sistema y aparecerá en «Piden acceso».',1);throw e;}
      await sec.auth().signOut();
      const d={nombre,email,rol,activo:true,creado:ts()};
      await db.collection('ebd_usuarios').doc(cred.user.uid).set(d);
      S.usuarios.push({id:cred.user.uid,nombre,email,rol,activo:true});S.usuarios.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
      await sincronizarEquipos(cred.user.uid,nombre,sel,true);cargando(false);
    }
    closeModal();render();toast('Usuario guardado.');
  }catch(e){cargando(false);toast(authErr(e),1);}
}

  [{label:'Cancelar',cls:'sec',fn:closeModal},{label:'Dar acceso',fn:async()=>{
    const nombre=$('u_nom').value.trim(),rol=solo?'profesor':$('u_rol').value,sel=clasesMarcadas(); if(!nombre)return toast('Falta el nombre.',1);
    try{const b=db.batch();b.set(db.collection('ebd_usuarios').doc(id),{nombre,email:p.email,rol,activo:true,creado:ts()});b.delete(db.collection('ebd_pendientes').doc(id));await b.commit();
      S.usuarios.push({id,nombre,email:p.email,rol,activo:true});S.pendientes=S.pendientes.filter(x=>x.id!==id);
      await sincronizarEquipos(id,nombre,sel,true);closeModal();render();toast('Acceso concedido.');}catch(e){toast(e.message,1);}
  }}]);
}
async function rechazarPendiente(id){
  const p=S.pendientes.find(x=>x.id===id);
  if(!await confirmBox(`¿Rechazar la solicitud de ${p.email}? No podrá entrar a la EBD, aunque puede volver a pedirlo.`,'Rechazar',true))return;
  try{await db.collection('ebd_pendientes').doc(id).delete();S.pendientes=S.pendientes.filter(x=>x.id!==id);render();toast('Solicitud rechazada.');}catch(e){toast(e.message,1);}
}
function tEval(){
  const c=S.cfg,p=c.pesos,campo=(k,t)=>`<div><label for="e_${k}">${t}</label><input id="e_${k}" type="number" min="0" max="100" value="${p[k]}"></div>`;
  return `<p class="muted">Puntos por criterio. Deben sumar 100. Los cambios rigen desde el próximo ciclo.</p>
  <div class="grid2">${campo('asistencia','Asistencia')}${campo('biblia','Trae Biblia')}${campo('revista','Trae revista')}${campo('participacion','Participación y actividades')}${campo('comportamiento','Puntualidad y comportamiento')}</div>
  <div class="bloque"><h2>Requisitos para el regalo</h2><div class="grid2">
    <div><label for="e_freq">Frecuencia mínima (%)</label><input id="e_freq" type="number" min="0" max="100" value="${c.frecuenciaMin}"></div>
    <div><label for="e_punt">Puntaje mínimo (de 100)</label><input id="e_punt" type="number" min="0" max="100" value="${c.puntajeMin}"></div></div></div>
  <div class="acciones"><button class="btn" data-act="evalguardar">Guardar criterios</button></div>`;
}
async function guardarEval(){
  const g=k=>parseInt($('e_'+k).value,10),pesos={};
  ['asistencia','biblia','revista','participacion','comportamiento'].forEach(k=>pesos[k]=g(k));
  if(Object.values(pesos).some(v=>isNaN(v)||v<0))return toast('Completa todos los puntos con números.',1);
  const suma=Object.values(pesos).reduce((a,b)=>a+b,0); if(suma!==100)return toast(`Los puntos suman ${suma}. Deben sumar 100.`,1);
  const fm=parseInt($('e_freq').value,10),pm=parseInt($('e_punt').value,10);
  if(isNaN(fm)||fm<0||fm>100||isNaN(pm)||pm<0||pm>100)return toast('Los mínimos deben estar entre 0 y 100.',1);
  try{await db.collection('ebd_config').doc('evaluacion').set({pesos,frecuenciaMin:fm,puntajeMin:pm});S.cfg={pesos,frecuenciaMin:fm,puntajeMin:pm};toast('Criterios guardados.');}catch(e){toast(e.message,1);}
}

/* ---------- Acciones (delegación de eventos) ---------- */
const acciones={
  async entrar(){
    try{await auth.signInWithEmailAndPassword($('l_mail').value.trim(),$('l_pass').value);}catch(e){toast(authErr(e),1);}
  },
  async crearprimer(){
    const n=$('l_nom').value.trim(); if(!n)return toast('Escribe tu nombre.',1);
    sessionStorage.setItem('ebd_nombre',n);
    try{await auth.createUserWithEmailAndPassword($('l_mail').value.trim(),$('l_pass').value);}catch(e){toast(authErr(e),1);}
  },
  modologin(d){pantallaLogin(d.m);},
  olvide(){
    openModal('Nueva contraseña','<label for="r_mail">Tu correo</label><input id="r_mail" type="email" inputmode="email">',
    [{label:'Cancelar',cls:'sec',fn:closeModal},{label:'Enviar correo',fn:async()=>{try{await auth.sendPasswordResetEmail($('r_mail').value.trim());closeModal();toast('Revisa tu correo.');}catch(e){toast(authErr(e),1);}}}]);
  },
  async bootstrap(){
    const n=(($('b_nom')&&$('b_nom').value)||sessionStorage.getItem('ebd_nombre')||'').trim(); if(!n)return toast('Escribe tu nombre.',1);
    cargando(true);
    try{const b=db.batch();b.set(db.collection('ebd_config').doc('init'),{uid:S.user.uid,fecha:ts()});
      b.set(db.collection('ebd_usuarios').doc(S.user.uid),{nombre:n,email:S.user.email||'',rol:'admin',activo:true,creado:ts()});await b.commit();
      sessionStorage.removeItem('ebd_nombre');await iniciarSesion();}
    catch(e){toast('No se pudo crear el administrador: '+e.message,1);}
    cargando(false);
  },
  salir(){auth.signOut();},
  ir(d){go(d.v);},
  ajtab(d){S.ajTab=d.t;render();},
  alnuevo(){modalAlumno(null,(S.fclase&&S.fclase!=='_sin')?S.fclase:'');},
  aledit(d){modalAlumno(d.id);},
  alasignar(){asignarPorEdad();},
  clnueva(){abrirClase(null);},
  cledit(d){abrirClase(d.id);},
  clguardar(){guardarClase();},
  clborrar(){borrarClase();},
  eqagregar(){
    syncClase(); const inp=$('c_prof'),n=inp.value.trim(); if(!n)return toast('Escribe el nombre del profesor.',1);
    const u=S.usuarios.find(u=>normTxt(u.nombre)===normTxt(n));
    S.edit.equipo.push({id:uid8(),nombre:u?u.nombre:n,uid:u?u.id:null}); render();
  },
  eqquitar(d){syncClase();const e=S.edit,i=+d.i;e.equipo.splice(i,1);if((e.turno||0)>i)e.turno--;if(e.turno>=e.equipo.length)e.turno=0;render();},
  eqsubir(d){syncClase();const e=S.edit,i=+d.i;if(i>0){[e.equipo[i-1],e.equipo[i]]=[e.equipo[i],e.equipo[i-1]];if(e.turno===i)e.turno=i-1;else if(e.turno===i-1)e.turno=i;}render();},
  eqbajar(d){syncClase();const e=S.edit,i=+d.i;if(i<e.equipo.length-1){[e.equipo[i+1],e.equipo[i]]=[e.equipo[i],e.equipo[i+1]];if(e.turno===i)e.turno=i+1;else if(e.turno===i+1)e.turno=i;}render();},
  eqturno(d){syncClase();S.edit.turno=+d.i;render();},
  fjnueva(){modalFaja(null);},
  fjedit(d){modalFaja(d.id);},
  usnuevo(){modalUsuario(null);},
  usedit(d){modalUsuario(d.id);},
  usdar(d){modalDarAcceso(d.id);},
  usrechazar(d){rechazarPendiente(d.id);},
  usinact(){S.verInact=!S.verInact;render();},
  cicloCrear(){crearCiclo();},
  ciclocerrar(){cerrarCiclo();},
  ciclolecc(){corregirLecciones();},
  evalguardar(){guardarEval();}
};
const cambios={
  filtro(){S.fq=$('f_q').value;S.fclase=$('f_c').value;pintarAlumnos();},
  alclase(){aplicarClaseSexo(true);}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&acciones[t.dataset.act]){e.preventDefault();acciones[t.dataset.act](t.dataset,t);}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&cambios[t.dataset.chg])cambios[t.dataset.chg](t.dataset,t);});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&cambios[t.dataset.inp])cambios[t.dataset.inp](t.dataset,t);});
document.addEventListener('toggle',e=>{if(e.target.id==='detLec')S.lecOpen=e.target.open;},true);
</script>
